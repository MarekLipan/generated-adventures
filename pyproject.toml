[project]
name = "generated-adventures"
version = "0.1.0"
description = "A tabletop-style adventure game where an LLM runs the story, local diffusion models paint the scenes, and a local voice narrates."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marek Lipan" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "google-genai>=1.29.0",
    "httpx>=0.27.0",
    "nicegui>=1.4.0",
    "Pillow>=10.5.0",
    "pydantic>=2.0",
    "pydantic-ai>=0.6.2",
    "pydantic-settings>=2.0",
    "reportlab>=4.0.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
adventures = "generated_adventures.webapp.cli:main"
adventures-image-server = "generated_adventures.image_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generated_adventures"]

# On Windows, torch comes from the PyTorch CUDA 12.6 wheel index, and
# torchvision uses the CPU wheel — the CUDA build has a broken _C extension
# on Windows/Python 3.13 (torchvision::nms operator not found), but the CPU
# build works fine since we only need it for InterpolationMode in transformers.
#
# On macOS (Apple Silicon) the PyTorch CUDA/CPU indexes have no wheels, so we
# let torch/torchvision resolve from the default PyPI index, which ships
# arm64 builds with Metal (MPS) acceleration.
[tool.uv]
default-groups = ["dev", "local-image", "local-tts"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
# Local models. Installed by default (see default-groups below); a cloud-only
# setup (Gemini for text, images and narration) can skip them with
# `uv sync --no-group local-image --no-group local-tts`.
local-image = [
    "accelerate>=1.12.0",
    "diffusers>=0.35.0",
    "gguf>=0.10.0",
    "safetensors>=0.7.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.57.3",
    # 4-bit/8-bit quantization for the Klein CUDA path. No macOS wheels; the
    # bitsandbytes path only runs on CUDA anyway.
    "bitsandbytes>=0.48.0; sys_platform != 'darwin'",
]
# Kokoro-82M narration via onnxruntime, on the CPU so it runs alongside image
# generation without competing for the GPU.
local-tts = [
    "kokoro-onnx>=0.4.0",
]
dev = [
    "import-linter>=2.15",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls a real external API and needs credentials; run with `pytest -m live`",
]
# Live tests cost money and need network access, so they are opt-in.
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's defaults: real errors (undefined names, syntax)
    "I",                    # import sorting
    "UP",                   # modern syntax for the target Python version
    "B",                    # bugbear: likely bugs and design problems
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through call defaults by design.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
preset = "default"
# Errors present when type checking was adopted. CI fails only on errors that
# are not in here; shrink it with `pyrefly check --prune-baseline` as you fix them.
baseline = "pyrefly-baseline.json"

# Architecture rules, checked in CI with `lint-imports`. docs/architecture.md
# draws the same layers.
[tool.importlinter]
root_package = "generated_adventures"

[[tool.importlinter.contracts]]
name = "The game engine does not depend on the web UI"
type = "forbidden"
source_modules = ["generated_adventures.core"]
forbidden_modules = ["generated_adventures.webapp"]

[[tool.importlinter.contracts]]
name = "UI components reach the engine through the service layer"
type = "forbidden"
source_modules = ["generated_adventures.webapp.components"]
# Reading models and config directly is fine; everything else goes via game_flow.
forbidden_modules = [
    "generated_adventures.core.character_updates",
    "generated_adventures.core.game",
    "generated_adventures.core.generation",
    "generated_adventures.core.image_backends",
    "generated_adventures.core.llm",
    "generated_adventures.core.media",
    "generated_adventures.core.names",
    "generated_adventures.core.persistence",
    "generated_adventures.core.prompts",
    "generated_adventures.core.tts_backends",
    "generated_adventures.core.voice_casting",
]
# Components -> game_flow -> core is the intended path; only direct imports count.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Generation steps do not manage game state or saving"
type = "forbidden"
source_modules = ["generated_adventures.core.generation"]
forbidden_modules = ["generated_adventures.core.game", "generated_adventures.core.persistence"]
